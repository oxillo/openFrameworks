name: build-msys2

on:
  push:
    paths-ignore:
    - '**/*.md'
    - 'examples/**'
  pull_request:
    paths-ignore:
    - '**/*.md'
    - 'examples/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-msys2:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
        - { sys: mingw64, env: x86_64 }
        #- { sys: mingw32, env: i686 }
        #- { sys: ucrt64,  env: ucrt-x86_64 }
        #- { sys: clang64, env: clang-x86_64 }
        #- clangarm64
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v3
    - uses: msys2/setup-msys2@v2
      with:
        update: true
        msystem: ${{ matrix.sys }}
        install: >-
          git
          unzip
          rsync
          wget
        pacboy: >-
            assimp:p
            boost:p
            cairo:p
            ccache:p
            curl:p
            fd:p
            freeglut:p
            FreeImage:p
            glew:p
            glfw:p
            glm:p
            harfbuzz:p
            libsndfile:p
            libusb:p
            libxml2:p
            mpg123:p
            nlohmann-json:p
            ntldd:p
            openal:p
            opencv:p
            poco:p
            pugixml:p
            rtaudio:p
            toolchain:p
            uriparser:p
            utf8cpp:p
            zlib:p
    - name: Cache compile
      id: cache-compile
      uses: actions/cache@v3
      env:
        cache-name: cache-keep-compile
      with:
        path: libs/openFrameworksCompiled/lib/msys2/**/
        key: ${{ runner.os }}-${{ matrix.sys }}-${{ env.cache-name }}-${{ hashFiles('**/*.cpp') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.sys }}-${{ env.cache-name }}-
    - name: Install dependencies
      run: ./scripts/msys2/download_libs.sh
    - name: Build
      run: ./scripts/ci/msys2/build.sh
    - name: Run tests
      run: ./scripts/ci/msys2/run_tests.sh
