name: build-msys2

on:
  push:
    paths-ignore:
    - '**/*.md'
    - 'examples/**'
  pull_request:
    paths-ignore:
    - '**/*.md'
    - 'examples/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-msys2:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
        - { sys: mingw64, env: x86_64 }
        #- { sys: mingw32, env: i686 }
        #- { sys: ucrt64,  env: ucrt-x86_64 }
        #- { sys: clang64, env: clang-x86_64 }
        #- clangarm64
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v3
    - uses: msys2/setup-msys2@v2
      with:
        update: true
        msystem: ${{ matrix.sys }}
        install: >-
          git
          unzip
          rsync
          wget
        pacboy: >-
            assimp:p
            binutils:p
            boost:p
            cairo:p
            ccache:p
            curl:p
            freeglut:p
            FreeImage:p
            glew:p
            glfw:p
            glm:p
            harfbuzz:p
            libsndfile:p
            libusb:p
            libxml2:p
            mpg123:p
            nlohmann-json:p
            ntldd:p
            openal:p
            opencv:p
            poco:p
            pugixml:p
            rtaudio:p
            toolchain:p
            uriparser:p
            utf8cpp:p
            zlib:p

             mingw-w64-x86_64-binutils  2) mingw-w64-x86_64-crt-git  3) mingw-w64-x86_64-gcc  4) mingw-w64-x86_64-gcc-ada  5) mingw-w64-x86_64-gcc-fortran  6) mingw-w64-x86_64-gcc-libgfortran  7) mingw-w64-x86_64-gcc-libs  8) mingw-w64-x86_64-gcc-objc  9) mingw-w64-x86_64-gdb  10) mingw-w64-x86_64-gdb-multiarch  11) mingw-w64-x86_64-headers-git  12) mingw-w64-x86_64-libgccjit  13) mingw-w64-x86_64-libmangle-git  14) mingw-w64-x86_64-libwinpthread-git  15) mingw-w64-x86_64-make  16) mingw-w64-x86_64-pkgconf  17) mingw-w64-x86_64-tools-git  18) mingw-w64-x86_64-winpthreads-git  19) mingw-w64-x86_64-winstorecompat-git
    - name: Cache compile
      id: cache-compile
      uses: actions/cache@v3
      env:
        cache-name: cache-keep-compile
      with:
        path: libs/openFrameworksCompiled/lib/msys2/**/
        key: ${{ runner.os }}-${{ matrix.sys }}-${{ env.cache-name }}-${{ hashFiles('**/*.cpp') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.sys }}-${{ env.cache-name }}-
    #- name: set-env
    #  uses: allenevans/set-env@v2.0.0
    #  with: 
    #    MINGW_PREFIX: /${{ matrix.sys }}
    #    MINGW_PACKAGE_PREFIX: mingw-w64-${{ matrix.env }}
    - name: Install dependencies
      run: ./scripts/msys2/download_libs.sh
    - name: AR version
      run: /mingw64/bin/ar V
    - name: Build
      run: ./scripts/ci/msys2/build.sh
    - name: Run tests
      run: ./scripts/ci/msys2/run_tests.sh
