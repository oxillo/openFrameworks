name: build-msys2

on:
  push:
    paths-ignore:
    - '**/*.md'
  pull_request:
    paths-ignore:
    - '**/*.md'
    
jobs:

  build-msys2:
    runs-on: windows-latest
    strategy:
      matrix:
        flavor:
          - mingw32 # Obsolete : kept for backward compatibility
          - mingw64
          - ucrt64
          #- clang32
          - clang64
          #- clangarm64

    name: ${{ matrix.flavor }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v2
    - uses: msys2/setup-msys2@v2
      with:
        update: true
        release : true
        msystem: ${{ matrix.flavor }}
        install: >-
          git
          unzip
          rsync
          wget
    - name: Install dependencies
      run: echo ${MSYSTEM} && ./scripts/ci/msys2/install.sh
    - name: Build
      run: ./scripts/ci/msys2/build.sh
      env:
        MSYSTEM: ${{ matrix.flavor }}
    - name: Run tests
      run: ./scripts/ci/msys2/run_tests.sh
      env:
        MSYSTEM: ${{ matrix.flavor }}
